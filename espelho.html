<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espelho de ponto · PontoLink</title>
<style>
:root{--ink:#1c2420;--muted:#66726c;--line:#c9d1cc;--green:#0e5a47}
*{box-sizing:border-box}
body{margin:0;background:#eef1ee;color:var(--ink);font:13px/1.35 system-ui,"Segoe UI",sans-serif}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.bar input{padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;min-width:0}
.bar button{padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer}
.bar .primary{background:var(--green);color:#fff;border:0;font-weight:600}
.note{color:var(--muted);padding:8px 16px;font-size:12px}
.sheet{background:#fff;width:210mm;max-width:100%;margin:16px auto;padding:12mm;box-shadow:0 1px 6px rgba(0,0,0,.15);break-after:page;overflow-x:auto}
h1{font-size:18px;margin:0 0 2px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;margin:8px 0 10px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--line);padding:2px 4px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums}
th{background:#f1f4f2;font-weight:600}
td.l{text-align:left}
tr.off td{background:#fafbfa;color:#8a958f}
.tot{margin:10px 0 0;display:flex;gap:10px;flex-wrap:wrap}
.tot div{border:1px solid var(--line);padding:5px 9px;border-radius:4px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}
.sign div{border-top:1px solid var(--ink);padding-top:4px;text-align:center;font-size:12px}
.foot{margin-top:10px;color:var(--muted);font-size:10.5px}
@media print{body{background:#fff}.bar,.note{display:none!important}.sheet{margin:0;box-shadow:none;width:auto;padding:0;overflow:visible}@page{size:A4;margin:10mm}}
</style>
</head>
<body>
<div class="bar">
  <button id="back">← Voltar ao painel</button>
  <input id="empresa" placeholder="Empresa (razão social)" size="26">
  <input id="cnpj" placeholder="CNPJ" size="18">
  <button class="primary" id="print">Imprimir / salvar PDF</button>
</div>
<div class="note">Dias sem marcação aparecem em branco: o sistema ainda não tem escala, então não diferencia folga, feriado e falta. Preencha à mão na coluna Obs., se precisar.</div>
<div id="sheets"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = new URLSearchParams(location.search);
const month = /^\d{4}-\d{2}$/.test(q.get('month') || '') ? q.get('month') : new Date().toISOString().slice(0, 7);
const which = q.get('employee') || 'all';
const pin = sessionStorage.getItem('adminPin') || '';
const hhmm = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
const fmtMin = (m) => (m < 0 ? '-' : '') + Math.floor(Math.abs(m) / 60) + 'h' + String(Math.abs(m) % 60).padStart(2, '0');
let emps = [], rep = null;

async function api(u) {
  const r = await fetch(u, { headers: { 'x-admin-pin': pin } });
  const d = await r.json().catch(() => null);
  if (!r.ok) throw new Error(d?.error || 'Erro ' + r.status);
  return d;
}

function sheet(e) {
  const [y, m] = month.split('-').map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const byDay = {};
  rep.days.filter((d) => d.employee_id === e.id).forEach((d) => { byDay[d.day] = d; });
  const sum = rep.summary.find((s) => s.employee_id === e.id) || { days_worked: 0, open_days: 0, worked_min: 0, expected_min: 0, balance_min: 0 };
  let rows = '';
  for (let d = 1; d <= last; d++) {
    const key = `${month}-${String(d).padStart(2, '0')}`;
    const wd = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('pt-BR', { weekday: 'short', timeZone: 'UTC' }).replace('.', '');
    const day = byDay[key];
    const t = (type) => { const p = day?.punches.find((x) => x.type === type); return p ? hhmm(p.ts) + (p.manual ? '*' : '') : ''; };
    const notes = day ? [...new Set(day.punches.filter((p) => p.manual && p.note).map((p) => esc(p.note)))].join('; ') : '';
    rows += `<tr class="${day ? '' : 'off'}"><td>${String(d).padStart(2, '0')}</td><td>${wd}</td><td>${t('entrada')}</td><td>${t('saida_almoco')}</td><td>${t('volta_almoco')}</td><td>${t('saida')}</td><td>${day ? (day.complete ? fmtMin(day.worked_min) : 'em aberto') : ''}</td><td>${day && day.complete ? fmtMin(day.balance_min) : ''}</td><td class="l">${notes ? '* ' + notes : ''}</td></tr>`;
  }
  const mes = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const empresa = $('#empresa').value.trim(), cnpj = $('#cnpj').value.trim();
  const hoje = new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });
  return `<section class="sheet">
    <h1>Espelho de ponto</h1>
    <div class="meta">
      <div><b>Funcionário:</b> ${esc(e.name)}</div><div><b>Período:</b> ${esc(mes)}</div>
      <div><b>Empresa:</b> ${esc(empresa) || '________________________'}</div><div><b>CNPJ:</b> ${esc(cnpj) || '____________________'}</div>
      <div><b>Jornada diária:</b> ${fmtMin(e.jornada_min)}</div><div><b>Tolerância:</b> ${e.tolerance_min} min por dia</div>
    </div>
    <table><thead><tr><th>Dia</th><th>Sem.</th><th>Entrada</th><th>Saída almoço</th><th>Volta almoço</th><th>Saída</th><th>Trabalhado</th><th>Saldo</th><th>Obs.</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="tot">
      <div><b>Dias trabalhados:</b> ${sum.days_worked}</div><div><b>Total trabalhado:</b> ${fmtMin(sum.worked_min)}</div>
      <div><b>Previsto:</b> ${fmtMin(sum.expected_min)}</div><div><b>Saldo do mês:</b> ${fmtMin(sum.balance_min)}</div>
      ${sum.open_days ? `<div><b>Dias em aberto:</b> ${sum.open_days}</div>` : ''}
    </div>
    <div class="sign"><div>${esc(e.name)}<br>Funcionário</div><div>Empregador / responsável</div></div>
    <p class="foot">* Marcação inserida manualmente pelo gestor, com justificativa. Horários de Brasília. Totais consideram só dias completos (com saída). Gerado pelo PontoLink em ${hoje}.</p>
  </section>`;
}

function render() {
  const list = which === 'all'
    ? emps.filter((e) => e.active || rep.summary.some((s) => s.employee_id === e.id))
    : emps.filter((e) => String(e.id) === which);
  $('#sheets').innerHTML = list.length ? list.map(sheet).join('') : '<p class="note">Nenhum funcionário encontrado.</p>';
  document.title = `Espelho de ponto ${month}${list.length === 1 ? ' - ' + list[0].name : ''}`;
}

$('#back').onclick = () => { location.href = '/'; };
$('#print').onclick = () => window.print();
for (const id of ['empresa', 'cnpj']) {
  try { $('#' + id).value = localStorage.getItem(id) || ''; } catch {}
  $('#' + id).oninput = () => { try { localStorage.setItem(id, $('#' + id).value); } catch {} if (rep) render(); };
}

(async () => {
  if (!pin) { $('#sheets').innerHTML = '<p class="note">Entre como gestor no painel e abra o espelho por lá.</p>'; return; }
  try {
    [emps, rep] = await Promise.all([api('/api/admin/employees'), api('/api/admin/report?month=' + month + (which !== 'all' ? '&employee=' + encodeURIComponent(which) : ''))]);
    render();
  } catch (err) { $('#sheets').innerHTML = `<p class="note">${esc(err.message)} Volte ao painel e entre como gestor.</p>`; }
})();
</script>
</body>
</html>
